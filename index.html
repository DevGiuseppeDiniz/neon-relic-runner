<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08121d" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Neon Dash Touch</title>
    <link rel="stylesheet" href="styles.css?v=10" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="gameCanvas" aria-label="Neon Dash Touch"></canvas>

      <section class="hud">
        <div>
          <span class="hud-label">Pontos</span>
          <strong id="scoreText">0</strong>
        </div>
        <div>
          <span class="hud-label">Recorde</span>
          <strong id="bestText">0</strong>
        </div>
        <div>
          <span class="hud-label">Moedas</span>
          <strong id="coinText">0</strong>
        </div>
      </section>

      <section id="debugPanel" class="debug-panel" aria-live="polite">
        <strong>DEBUG v10</strong>
        <span id="debugBridge">bridge: aguardando</span>
        <span id="debugCommand">command: nenhum</span>
        <span id="debugInput">input: nenhum</span>
      </section>

      <section id="messagePanel" class="message-panel visible">
        <p class="eyebrow">Touch screen arcade</p>
        <h1>Neon Dash</h1>
        <p id="messageText">Versao v10. Toque em qualquer lugar para iniciar. Toque para pular.</p>
      </section>

      <button
        id="touchCatcher"
        class="touch-catcher"
        type="button"
        aria-label="Controle de toque"
        ontouchstart="window.neonDashPress && window.neonDashPress(event)"
        ontouchend="window.neonDashRelease && window.neonDashRelease(event)"
        onpointerdown="window.neonDashPress && window.neonDashPress(event)"
        onpointerup="window.neonDashRelease && window.neonDashRelease(event)"
        onmousedown="window.neonDashPress && window.neonDashPress(event)"
        onmouseup="window.neonDashRelease && window.neonDashRelease(event)"
        onclick="window.neonDashPress && window.neonDashPress(event)"
      ></button>

      <div class="tap-zone">
        <span id="tapHint">TOQUE PARA PULAR</span>
      </div>
    </main>

    <script src="script.js?v=10"></script>
  </body>
</html>
