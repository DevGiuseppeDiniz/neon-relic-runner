<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08121d" />
    <title>Neon Dash Touch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="gameCanvas" aria-label="Neon Dash Touch"></canvas>

      <section class="hud">
        <div>
          <span class="hud-label">Pontos</span>
          <strong id="scoreText">0</strong>
        </div>
        <div>
          <span class="hud-label">Recorde</span>
          <strong id="bestText">0</strong>
        </div>
        <div>
          <span class="hud-label">Moedas</span>
          <strong id="coinText">0</strong>
        </div>
      </section>

      <section id="messagePanel" class="message-panel visible">
        <p class="eyebrow">Touch screen arcade</p>
        <h1>Neon Dash</h1>
        <p id="messageText">Toque em qualquer lugar para iniciar. Toque para pular.</p>
      </section>

      <div class="tap-zone">
        <span id="tapHint">TOQUE PARA PULAR</span>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
